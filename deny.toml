# Cargo-deny supply chain security configuration.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
yanked = "deny"
unmaintained = "workspace"
# paste v1.0.15 unmaintained — transitive dep via netstat2 -> netlink-packet-utils (Linux only).
# RUSTSEC-2023-0071 (rsa 0.9.10 Marvin Attack sidechannel) — transitive dep via sqlx. No 0.9 patch available.
ignore = ["RUSTSEC-2024-0436", "RUSTSEC-2023-0071"]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "0BSD",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
skip = []
skip-tree = []
deny = [
    # Single Egress Boundary Enforcement.
    # Outbound network client crates are banned everywhere except netpulse-ai.

    # HTTP clients
    { name = "reqwest", wrappers = ["netpulse-ai"] },
    { name = "hyper", wrappers = ["netpulse-ai"] },
    { name = "ureq", wrappers = ["netpulse-ai"] },
    { name = "attohttpc", wrappers = ["netpulse-ai"] },
    { name = "isahc", wrappers = ["netpulse-ai"] },
    { name = "surf", wrappers = ["netpulse-ai"] },

    # WebSockets
    { name = "tokio-tungstenite", wrappers = ["netpulse-ai"] },
    { name = "tungstenite", wrappers = ["netpulse-ai"] },

    # reqwest ecosystem
    { name = "reqwest-middleware", wrappers = ["netpulse-ai"] },
    { name = "reqwest-eventsource", wrappers = ["netpulse-ai"] },

    # WASM networking
    { name = "gloo-net", wrappers = ["netpulse-ai"] },

    # async HTTP
    { name = "async-h1", wrappers = ["netpulse-ai"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
