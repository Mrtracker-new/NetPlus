# NetPulse CI — Supply Chain Security & Build Matrix

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # Weekly Monday 04:00 UTC audit run

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned toolchain (1.96.0)
        uses: dtolnay/rust-toolchain@stable
        with:
          # Keep this version synchronized with:
          #   rust-toolchain.toml
          #   Cargo.toml (workspace.rust-version)
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Verify pinned Rust toolchain environment
        run: |
          rustc --version
          cargo --version
          rustup show active-toolchain
          rustfmt --version
          clippy-driver --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Verify Cargo lockfiles are unchanged
        run: git diff --exit-code Cargo.lock src-tauri/Cargo.lock

      - name: Verify documentation status synchronization & links
        run: python scripts/verify_docs_status.py

      - name: Contract drift
        shell: bash
        run: |
          cargo test -p netpulse-api -- --ignored write_contract
          git diff --exit-code ui/packages/contract/src/generated.ts

  ui:
    name: UI (typecheck + contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install deps
        run: pnpm install

      - name: Typecheck contract
        run: pnpm --filter @netpulse/contract typecheck

      - name: Build components
        run: pnpm --filter @netpulse/components build

      - name: Typecheck components
        run: pnpm --filter @netpulse/components typecheck

      - name: Build viz
        run: pnpm --filter @netpulse/viz build

      - name: Typecheck viz
        run: pnpm --filter @netpulse/viz typecheck

      - name: Typecheck app
        run: pnpm --filter @netpulse/app typecheck

      - name: Test components
        run: pnpm --filter @netpulse/components test

      - name: Test app
        run: pnpm --filter @netpulse/app test

  audit:
    name: Security Audit (cargo-audit + cargo-deny + pnpm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned toolchain (1.96.0)
        uses: dtolnay/rust-toolchain@stable
        with:
          # Keep this version synchronized with:
          #   rust-toolchain.toml
          #   Cargo.toml (workspace.rust-version)
          toolchain: 1.96.0

      - name: Verify pinned Rust toolchain environment
        run: |
          rustc --version
          cargo --version
          rustup show active-toolchain

      - name: Cache cargo & RustSec advisory DB
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit & cargo-deny
        run: cargo install cargo-audit cargo-deny --locked || true

      - name: Metadata resolution (workspace)
        run: cargo metadata --manifest-path Cargo.toml --format-version 1 > /dev/null

      - name: Metadata resolution (desktop shell)
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null

      - name: Verify workspace lockfile compilation
        run: cargo check --workspace --locked

      - name: Cargo audit - workspace (vulnerabilities & advisories)
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2023-0071

      - name: Cargo audit - desktop shell (vulnerabilities & advisories)
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2024-0411 --ignore RUSTSEC-2024-0412 --ignore RUSTSEC-2024-0413 --ignore RUSTSEC-2024-0414 --ignore RUSTSEC-2024-0415 --ignore RUSTSEC-2024-0416 --ignore RUSTSEC-2024-0417 --ignore RUSTSEC-2024-0418 --ignore RUSTSEC-2024-0419 --ignore RUSTSEC-2024-0420 --ignore RUSTSEC-2024-0429 --ignore RUSTSEC-2025-0075 --ignore RUSTSEC-2025-0080 --ignore RUSTSEC-2025-0081 --ignore RUSTSEC-2025-0098 --ignore RUSTSEC-2025-0100 --file src-tauri/Cargo.lock

      - name: Cargo deny - workspace (licenses, bans, sources)
        run: cargo deny check advisories bans licenses sources

      - name: Cargo deny - desktop shell (licenses, bans, sources)
        working-directory: src-tauri
        run: cargo deny --config ../deny.toml check advisories bans licenses sources

      - name: Verify Cargo lockfiles are unchanged
        run: git diff --exit-code Cargo.lock src-tauri/Cargo.lock

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: pnpm audit (production dependencies)
        run: pnpm audit --prod --audit-level high

  tauri-check:
    name: Tauri Check (${{ matrix.os }})
    needs: [rust, ui]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="10"
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev

      - name: Setup Npcap SDK (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $repoLib = "$env:GITHUB_WORKSPACE\src-tauri\lib\x64"
          echo "NPCAP_SDK_PATH=$env:GITHUB_WORKSPACE\src-tauri" >> $env:GITHUB_ENV
          echo "LIB=$repoLib;$env:LIB" >> $env:GITHUB_ENV

      - name: Install pinned toolchain (1.96.0)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Cache cargo (desktop shell)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> src-tauri/target"

      - name: Desktop shell Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings

      - name: Desktop shell Unit & Integration Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features

      - name: Build frontend app
        run: pnpm --filter @netpulse/app... build

      - name: Verify Cargo lockfiles are unchanged
        run: git diff --exit-code Cargo.lock src-tauri/Cargo.lock

  tauri-build:
    name: Tauri Build (${{ matrix.os }})
    needs: [tauri-check]
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip desktop]')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="10"
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev patchelf libfuse2t64 libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Setup Npcap SDK (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $repoLib = "$env:GITHUB_WORKSPACE\src-tauri\lib\x64"
          echo "NPCAP_SDK_PATH=$env:GITHUB_WORKSPACE\src-tauri" >> $env:GITHUB_ENV
          echo "LIB=$repoLib;$env:LIB" >> $env:GITHUB_ENV

      - name: Install pinned toolchain (1.96.0)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Cache cargo (desktop shell)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> src-tauri/target"

      - name: Build frontend app
        run: pnpm --filter @netpulse/app... build

      - name: Build Tauri Desktop Application
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: node ui/app/node_modules/@tauri-apps/cli/tauri.js build

      - name: Validate OS Bundle Directories & Generate Checksums (Linux / macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p artifacts
          echo "::group::Validating installer outputs"
          find src-tauri/target/release/bundle -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.app" \) -exec cp {} artifacts/ \;
          if [ -z "$(ls -A artifacts)" ]; then
            echo "ERROR: No installer packages found in src-tauri/target/release/bundle/"
            exit 1
          fi
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "::endgroup::"

      - name: Validate OS Bundle Directories & Generate Checksums (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          $files = Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -Include *.msi,*.exe
          if ($files.Count -eq 0) {
            Write-Error "ERROR: No installer packages found in src-tauri/target/release/bundle/"
            exit 1
          }
          foreach ($file in $files) {
            Copy-Item $file.FullName -Destination artifacts\
          }
          Set-Location artifacts
          Get-ChildItem -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | Get-FileHash -Algorithm SHA256 | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Upload Desktop Application Artifacts (${{ matrix.os }})
        uses: actions/upload-artifact@v7
        with:
          name: netpulse-desktop-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

