# NetPulse Fuzzing Workflow — Bounded Automated Fuzzing & Crash Artifact Upload

name: Protocol Dissector Fuzzing

on:
  schedule:
    - cron: "0 2 * * *" # Daily at 02:00 UTC
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: nightly

jobs:
  fuzz:
    name: Cargo Fuzz Protocol Dissectors
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
          targets: x86_64-unknown-linux-gnu
          components: rust-src, llvm-tools-preview

      - name: Install cargo-fuzz prebuilt binary
        uses: taiki-e/install-action@d8c10dae823f48238abff23fee4146b448aed2f1 # v2
        with:
          tool: cargo-fuzz

      - name: Configure fuzzing toolchain
        shell: bash
        run: |
          rustup default nightly-x86_64-unknown-linux-gnu
          rustup override set nightly-x86_64-unknown-linux-gnu
          rustup target add x86_64-unknown-linux-gnu
          rustup show active-toolchain

      - name: Run Fuzz Targets (Bounded ~60s per target)
        shell: bash
        run: |
          mkdir -p fuzz/logs fuzz/artifacts
          targets=("fuzz_decode_frame" "fuzz_ethernet" "fuzz_ipv4" "fuzz_ipv6" "fuzz_tcp" "fuzz_udp" "fuzz_dns" "fuzz_http" "fuzz_tls")
          failed_targets=()
          echo "=== Protocol Dissector Fuzzing Run ==="

          for t in "${targets[@]}"; do
            echo "::group::Fuzzing target: $t"
            log_file="fuzz/logs/${t}.log"

            set +e
            cargo fuzz run "$t" --target x86_64-unknown-linux-gnu -- -max_total_time=60 -max_len=4096 -rss_limit_mb=4096 2>&1 | tee "$log_file"
            exit_code=${PIPESTATUS[0]}
            set -e

            if [ $exit_code -eq 0 ]; then
              echo "::notice::Target $t PASSED (clean exit, no crash detected)"
            else
              echo "::error::Target $t FAILED with exit code $exit_code"
              if grep -q -i "error: failed to build fuzz script\|error: sanitizer is incompatible\|error\[E0463\]\|can't find crate for\|could not compile" "$log_file"; then
                echo "::error::Target $t classification: BUILD / HARNESS CONFIGURATION FAILURE"
              elif grep -q -E "AddressSanitizer:\s*(heap|stack|global|use-after|null|deadly)|MemorySanitizer:|UndefinedBehaviorSanitizer:|SUMMARY: AddressSanitizer" "$log_file"; then
                echo "::error::Target $t classification: SANITIZER FAILURE"
              elif grep -q -i "deadly signal\|panic\|assertion failed\|SIGABRT\|SIGSEGV" "$log_file"; then
                echo "::error::Target $t classification: CRASH / PANIC"
              elif grep -q -i "timeout\|ALARM" "$log_file"; then
                echo "::error::Target $t classification: TIMEOUT"
              elif grep -q -i "out-of-memory\|rss limit exceeded" "$log_file"; then
                echo "::error::Target $t classification: OOM / RSS EXCEEDED"
              else
                echo "::error::Target $t classification: HARNESS / EXECUTION FAILURE"
              fi
              failed_targets+=("$t (exit code $exit_code)")
            fi
            echo "::endgroup::"
          done

          echo "=== Fuzzing Summary ==="
          if [ ${#failed_targets[@]} -gt 0 ]; then
            echo "::error::Fuzzing encountered failures on ${#failed_targets[@]} target(s):"
            for f in "${failed_targets[@]}"; do
              echo "  - $f"
            done
            exit 1
          else
            echo "All ${#targets[@]} fuzz targets completed cleanly with zero crashes."
          fi

      - name: Upload Fuzzing Logs & Crash Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-diagnostics-and-crashes
          path: |
            fuzz/logs/
            fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14
