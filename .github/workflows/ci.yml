# NetPulse CI — Supply Chain Security & Build Matrix

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # Weekly Monday 04:00 UTC audit run
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned toolchain (1.96.0)
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          # Keep this version synchronized with:
          #   rust-toolchain.toml
          #   Cargo.toml (workspace.rust-version)
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Verify pinned Rust toolchain environment
        run: |
          rustc --version
          cargo --version
          rustup show active-toolchain
          rustfmt --version
          clippy-driver --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Verify Cargo lockfiles are unchanged
        run: git diff --exit-code Cargo.lock src-tauri/Cargo.lock

      - name: Verify documentation status synchronization & links
        run: python scripts/verify_docs_status.py

      - name: Verify workflow invariants & security policies
        run: python scripts/verify_workflow_invariants.py

      - name: Contract drift
        shell: bash
        run: |
          cargo test -p netpulse-api -- --ignored write_contract
          git diff --exit-code ui/packages/contract/src/generated.ts

  ui:
    name: UI (typecheck + contract + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9.0.0
          run_install: false

      - name: Install Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck contract
        run: pnpm --filter @netpulse/contract typecheck

      - name: Build components
        run: pnpm --filter @netpulse/components build

      - name: Typecheck components
        run: pnpm --filter @netpulse/components typecheck

      - name: Build viz
        run: pnpm --filter @netpulse/viz build

      - name: Typecheck viz
        run: pnpm --filter @netpulse/viz typecheck

      - name: Typecheck app
        run: pnpm --filter @netpulse/app typecheck

      - name: Test components
        run: pnpm --filter @netpulse/components test

      - name: Test viz
        run: pnpm --filter @netpulse/viz test

      - name: Test app
        run: pnpm --filter @netpulse/app test

      - name: Verify GeoIP database
        run: pnpm run geoip:verify

  audit:
    name: Security Audit (cargo-audit + cargo-deny + pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned toolchain (1.96.0)
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          # Keep this version synchronized with:
          #   rust-toolchain.toml
          #   Cargo.toml (workspace.rust-version)
          toolchain: 1.96.0

      - name: Verify pinned Rust toolchain environment
        run: |
          rustc --version
          cargo --version
          rustup show active-toolchain

      - name: Cache cargo & RustSec advisory DB
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5

      - name: Install cargo-audit & cargo-deny prebuilt binaries
        uses: taiki-e/install-action@d8c10dae823f48238abff23fee4146b448aed2f1 # v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Metadata resolution (workspace)
        run: cargo metadata --manifest-path Cargo.toml --format-version 1 > /dev/null

      - name: Metadata resolution (desktop shell)
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null

      - name: Verify workspace lockfile compilation
        run: cargo check --workspace --locked

      - name: Cargo audit - workspace (vulnerabilities & advisories)
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2023-0071

      - name: Cargo audit - desktop shell (vulnerabilities & advisories)
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2024-0411 --ignore RUSTSEC-2024-0412 --ignore RUSTSEC-2024-0413 --ignore RUSTSEC-2024-0414 --ignore RUSTSEC-2024-0415 --ignore RUSTSEC-2024-0416 --ignore RUSTSEC-2024-0417 --ignore RUSTSEC-2024-0418 --ignore RUSTSEC-2024-0419 --ignore RUSTSEC-2024-0420 --ignore RUSTSEC-2024-0429 --ignore RUSTSEC-2025-0075 --ignore RUSTSEC-2025-0080 --ignore RUSTSEC-2025-0081 --ignore RUSTSEC-2025-0098 --ignore RUSTSEC-2025-0100 --file src-tauri/Cargo.lock

      - name: Cargo deny - workspace (licenses, bans, sources)
        run: cargo deny check advisories bans licenses sources

      - name: Cargo deny - desktop shell (licenses, bans, sources)
        run: cargo deny --manifest-path src-tauri/Cargo.toml check advisories bans licenses sources

      - name: Verify Cargo lockfiles are unchanged
        run: git diff --exit-code Cargo.lock src-tauri/Cargo.lock

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9.0.0
          run_install: false

      - name: Install Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: pnpm audit (production dependencies)
        run: pnpm audit --prod --audit-level high

  tauri-check:
    name: Tauri Check (${{ matrix.os }})
    needs: [rust, ui]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="10"
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev

      - name: Setup Npcap SDK (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $repoLib = "$env:GITHUB_WORKSPACE\src-tauri\lib\x64"
          "NPCAP_SDK_PATH=$env:GITHUB_WORKSPACE\src-tauri" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIB=$repoLib;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install pinned toolchain (1.96.0)
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: 1.96.0
          components: clippy

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9.0.0
          run_install: false

      - name: Install Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Cache cargo (desktop shell)
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          workspaces: "src-tauri -> src-tauri/target"

      - name: Desktop shell Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings

      - name: Desktop shell Unit & Integration Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features

      - name: Build frontend app
        run: pnpm --filter @netpulse/app... build

      - name: Verify Cargo lockfiles are unchanged
        run: git diff --exit-code Cargo.lock src-tauri/Cargo.lock

  tauri-build:
    name: Tauri Build (${{ matrix.os }})
    needs: [tauri-check]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && !contains(github.event.head_commit.message, '[skip desktop]')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="10"
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev patchelf libfuse2t64 libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Setup Npcap SDK (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $repoLib = "$env:GITHUB_WORKSPACE\src-tauri\lib\x64"
          "NPCAP_SDK_PATH=$env:GITHUB_WORKSPACE\src-tauri" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIB=$repoLib;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install pinned toolchain (1.96.0)
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: 1.96.0

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9.0.0
          run_install: false

      - name: Install Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Cache cargo (desktop shell)
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          workspaces: "src-tauri -> src-tauri/target"

      - name: Build frontend app
        run: pnpm --filter @netpulse/app... build

      - name: Build Tauri Desktop Application
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: pnpm --filter @netpulse/app exec tauri build

      - name: Validate OS Bundle Directories & Generate Checksums (Linux / macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p artifacts
          echo "::group::Packaging & Validating installer outputs"
          # Copy standalone distributable files (deb, rpm, AppImage, dmg)
          find src-tauri/target/release/bundle -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.dmg" \) -exec cp -v {} artifacts/ \;
          if [ -d "src-tauri/target/release/bundle/macos/NetPulse.app" ]; then
            echo "Archiving NetPulse.app deterministically via Python standard library..."
            python3 -c "
          import os, tarfile, gzip
          app_dir = 'src-tauri/target/release/bundle/macos/NetPulse.app'
          base_dir = os.path.dirname(app_dir)
          out_file = 'artifacts/NetPulse-macos-app.tar.gz'
          with open(out_file, 'wb') as f_out:
              with gzip.GzipFile(filename='', mode='wb', fileobj=f_out, mtime=0) as gz_out:
                  with tarfile.open(mode='w', fileobj=gz_out, format=tarfile.GNU_FORMAT) as tar:
                      all_paths = [app_dir]
                      for root, dirs, files in os.walk(app_dir):
                          for d in dirs:
                              all_paths.append(os.path.join(root, d))
                          for f in files:
                              all_paths.append(os.path.join(root, f))
                      for path in sorted(all_paths):
                          arcname = os.path.relpath(path, base_dir).replace('\\\\', '/')
                          ti = tar.gettarinfo(path, arcname=arcname)
                          ti.uid = 0
                          ti.gid = 0
                          ti.uname = ''
                          ti.gname = ''
                          ti.mtime = 1767225600
                          if os.path.isfile(path) and not os.path.islink(path):
                              with open(path, 'rb') as f_in:
                                  tar.addfile(ti, f_in)
                          else:
                              tar.addfile(ti)
          "
          fi

          if [ -z "$(ls -A artifacts)" ]; then
            echo "ERROR: No installer packages found in src-tauri/target/release/bundle/"
            exit 1
          fi

          # Generate deterministic, sorted sha256 checksums of regular files only (cross-platform Linux/macOS)
          cd artifacts
          if command -v sha256sum >/dev/null 2>&1; then
            find . -maxdepth 1 -type f ! -name "SHA256SUMS.txt" -exec sha256sum {} + | sort -k 2 | sed 's|  \./|  |' > SHA256SUMS.txt
          else
            find . -maxdepth 1 -type f ! -name "SHA256SUMS.txt" -exec shasum -a 256 {} + | sort -k 2 | sed 's|  \./|  |' > SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt
          echo "::endgroup::"

      - name: Validate OS Bundle Directories & Generate Checksums (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          $files = Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -Include *.msi,*.exe
          if (@($files).Count -eq 0) {
            Write-Error "ERROR: No installer packages found in src-tauri/target/release/bundle/"
            exit 1
          }
          foreach ($file in $files) {
            Copy-Item $file.FullName -Destination artifacts\
          }
          $entries = Get-ChildItem -Path artifacts -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | Sort-Object Name | ForEach-Object {
              $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
          }
          $entries | Out-File -FilePath artifacts\SHA256SUMS.txt -Encoding utf8
          Get-Content artifacts\SHA256SUMS.txt

      - name: Upload Desktop Application Artifacts (${{ matrix.os }})
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: netpulse-desktop-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
