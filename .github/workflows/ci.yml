# NetPulse CI — Supply Chain Security & Build Matrix

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # Weekly Monday 04:00 UTC audit run

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Contract drift
        shell: bash
        run: |
          cargo test -p netpulse-api -- --ignored write_contract
          git diff --exit-code ui/packages/contract/src/generated.ts

  ui:
    name: UI (typecheck + contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: pnpm install

      - name: Typecheck contract
        run: pnpm --filter @netpulse/contract typecheck

      - name: Build components
        run: pnpm --filter @netpulse/components build

      - name: Typecheck components
        run: pnpm --filter @netpulse/components typecheck

      - name: Build viz
        run: pnpm --filter @netpulse/viz build

      - name: Typecheck viz
        run: pnpm --filter @netpulse/viz typecheck

      - name: Typecheck app
        run: pnpm --filter @netpulse/app typecheck

      - name: Test components
        run: pnpm --filter @netpulse/components test

      - name: Test app
        run: pnpm --filter @netpulse/app test

  audit:
    name: Security Audit (cargo-audit + cargo-deny + pnpm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo & RustSec advisory DB
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit & cargo-deny
        run: cargo install cargo-audit cargo-deny --locked || true

      - name: Cargo audit (vulnerabilities & advisories)
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0436

      - name: Cargo deny (licenses, bans, sources)
        run: cargo deny check advisories bans licenses sources

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: pnpm audit (production dependencies)
        run: pnpm audit --prod --audit-level high || true
