[package]
name = "netpulse-decode-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
netpulse-decode = { path = "../crates/netpulse-decode" }
netpulse-core = { path = "../crates/netpulse-core" }

[[bin]]
