[package]
name = "netpulse-plugin"
description = "The extension seams: plugin types, contracts, and the capability/trust model that keeps third-party code from breaking NetPulse's guarantees."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Deps are deliberately minimal: core (for the reused Dissector/Detector traits
# and the Finding model) and serde. NO networking crate — a plugin never gets
# egress, and this crate must not add any (egress-boundary gate).
[dependencies]
netpulse-core = { path = "../netpulse-core" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
ed25519-compact = "2.1"


[lints]
workspace = true
