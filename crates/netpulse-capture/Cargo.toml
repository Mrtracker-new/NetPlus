[package]
name = "netpulse-capture"
description = "Capture pipeline: interface enumeration, ring feeding, timestamping, staged shedding (docs/05)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
netpulse-core = { path = "../netpulse-core" }
netpulse-platform = { path = "../netpulse-platform" }
netpulse-decode = { path = "../netpulse-decode" }
# Recording manifests (version pins, privacy manifest, checkpoints) serialize to
# a JSON sidecar (docs/22 §3.1). serde/serde_json are already workspace deps —
# no new external crate enters the tree (docs/03 §14).
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
