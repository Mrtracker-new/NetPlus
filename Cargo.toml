# NetPulse — Rust workspace manifest.
#
# The dependency graph across these crates is the system layer diagram.
# Arrows point strictly downward; Cargo forbids cycles, so a layer violation fails to compile.
# See ARCHITECTURE.md for the full system architecture mapping.

[workspace]
resolver = "2"
# `crates/*` are the product layers; `plugins/*` are the first-party reference
# plugins — in-tree so CI builds and conformance-tests them as living
# examples of each extension seam.
members = ["crates/*", "plugins/*"]
# The Tauri desktop shell is its own build: it depends on the platform webview
# system libraries and the Tauri CLI, which the pure-Rust workspace CI job does
# not provision. Excluding it keeps `cargo build/test --workspace` fast and
# webview-free; the shell is built by the UI job under the Tauri toolchain.
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/netpulse/netpulse"
authors = ["The NetPulse contributors"]

# Shared external dependencies, pinned once and referenced with
# `<crate>.workspace = true`. Kept deliberately small: for a security tool,
# dependencies represent attack surface.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# JSON is the control/low-volume IPC encoding; used by the API contract crate
# and its drift tests. Not a networking dependency, so it does not affect the
# single-egress-boundary gate.
serde_json = "1"
thiserror = "2"
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
tracing-appender = "0.2"
time = { version = "0.3", features = ["formatting", "macros"] }
httparse = "1.8"
sentry = "0.34"
sentry-tracing = "0.34"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }
directories = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Workspace-wide lints. Memory safety on hostile input is the defining
# requirement of this codebase, so unsafe is denied by default.
# Crates that genuinely need it (e.g. netpulse-platform FFI) re-allow locally
# with a documented justification and review.
[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"
