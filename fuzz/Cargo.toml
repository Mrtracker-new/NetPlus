test = false
doc = false

[[bin]]
name = "fuzz_tcp"
path = "fuzz_targets/fuzz_tcp.rs"
test = false
doc = false

[[bin]]
name = "fuzz_udp"
path = "fuzz_targets/fuzz_udp.rs"
test = false
doc = false

[[bin]]
name = "fuzz_dns"
path = "fuzz_targets/fuzz_dns.rs"
test = false
doc = false

[[bin]]
name = "fuzz_http"
