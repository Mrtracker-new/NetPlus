[package]
name = "netpulse-plugin"
description = "The extension seams: plugin types, contracts, and the capability/trust model that keeps third-party code from breaking NetPulse's guarantees (docs/24)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Deps are deliberately minimal: core (for the reused Dissector/Detector traits
# and the Finding model) and serde. NO networking crate — a plugin never gets
# egress, and this crate must not add any (docs/24 §5, egress-boundary gate
# docs/04 §7).
[dependencies]
netpulse-core = { path = "../netpulse-core" }
serde = { workspace = true }

[lints]
workspace = true
