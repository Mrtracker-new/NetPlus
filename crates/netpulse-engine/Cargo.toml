[package]
name = "netpulse-engine"
description = "The analysis process: wires decode → flow → narrative → storage → intel → ai/learn and serves the API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "netpulse-engine"
path = "src/main.rs"

[lib]
name = "netpulse_engine"
path = "src/lib.rs"

# The engine sits at the top of the graph and may depend on every lower layer.
# It runs at USER privilege — it holds no raw-capture capability.
[dependencies]
netpulse-core = { path = "../netpulse-core" }
netpulse-api = { path = "../netpulse-api" }
netpulse-storage = { path = "../netpulse-storage" }
netpulse-decode = { path = "../netpulse-decode" }
netpulse-flow = { path = "../netpulse-flow" }
netpulse-narrative = { path = "../netpulse-narrative" }
netpulse-intel = { path = "../netpulse-intel" }
netpulse-ai = { path = "../netpulse-ai" }
netpulse-learn = { path = "../netpulse-learn" }
netpulse-capture = { path = "../netpulse-capture" }
netpulse-plugin = { path = "../netpulse-plugin" }
# Structured JSON export. serde_json is an existing workspace dep.
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
