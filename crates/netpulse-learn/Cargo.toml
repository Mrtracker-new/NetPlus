[package]
name = "netpulse-learn"
description = "Education engine: grounded lessons, protocol explorer, and animation models over the user's own captures (docs/13, docs/15, docs/16)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
netpulse-core = { path = "../netpulse-core" }
netpulse-storage = { path = "../netpulse-storage" }
# The education layer speaks the explanation-key vocabulary (docs/07 §7): lessons,
# the explorer, and animations all key off `netpulse-decode`'s emitted keys and
# their content, so one identifier unifies the whole system (docs/07 §7.3). decode
# stays dependency-light itself, so this does not widen the fuzzed parser's deps.
netpulse-decode = { path = "../netpulse-decode" }
serde.workspace = true

[dev-dependencies]
# Progress persistence is verified by a serde round-trip (docs/13 §11); JSON is
# the test encoding only — the crate itself pulls in no serialization format.
serde_json.workspace = true

[lints]
workspace = true
